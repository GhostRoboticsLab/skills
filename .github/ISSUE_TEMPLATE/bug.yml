name: Bug
description: A skill did the wrong thing in a real session. One bug per issue.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Repro first, and keep it to one screen. If an agent drafted this, cut it down to the repro before you post. Leave out names, account ids and paths from your machine. See [CONTRIBUTING.md](https://github.com/GhostRoboticsLab/skills/blob/main/CONTRIBUTING.md).
  - type: input
    id: skill
    attributes:
      label: Skill
      description: Which skill, such as `hand-test`.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version or commit
      description: The plugin version, or the commit you installed from.
      placeholder: 0.1.0, or 4588b32
    validations:
      required: true
  - type: input
    id: harness
    attributes:
      label: Agent and install route
      description: The agent and its version, the model, and how you installed (plugin or skills.sh).
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: What happened
      description: The smallest steps that show the bug, and what the skill did. Paste the relevant part of the session.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
      description: What the skill should have done, and which line of its SKILL.md says so, if one does.
    validations:
      required: true
  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: This issue is about one problem.
          required: true
        - label: I searched open and closed issues for a duplicate.
          required: true
